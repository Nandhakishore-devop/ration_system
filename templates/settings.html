<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Smart Ration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="gem" color="white" size="24"></i>
                </div>
                <span>{{ shop_name }}</span>
            </div>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/register">New Registration</a>
                <a href="/customers">Customer Details</a>
            </nav>
            <div class="header-actions">
                <a href="/settings" class="active" style="display: flex; align-items: center;"><i data-lucide="settings"
                        size="20" color="white"></i></a>
                <a href="/profile"
                    style="width: 32px; height: 32px; border-radius: 50%; background: #45b26b; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-weight: bold; font-size: 0.8rem;">NK</a>
            </div>
        </header>

        <main style="max-width: 800px; margin: 0 auto;">
            <section class="card glass">
                <h1 style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
                    <i data-lucide="settings" size="32" color="var(--accent)"></i> System Settings
                </h1>

                <form action="/settings" method="POST">
                    <div style="margin-bottom: 2rem;">
                        <label
                            style="display: block; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Shop
                            Name</label>
                        <input type="text" name="shop_name" value="{{ shop_name }}"
                            style="width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; color: white; font-family: var(--font-main); font-size: 1.1rem; outline: none; transition: border-color 0.3s;"
                            onfocus="this.style.borderColor='var(--accent)'"
                            onblur="this.style.borderColor='var(--border)'">
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label
                            style="display: block; color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Notification
                            Preferences</label>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <div
                                style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                                <div>
                                    <div style="font-weight: 600;">Automated SMS Alerts</div>
                                    <div style="font-size: 0.85rem; color: var(--text-muted);">Send SMS to users on
                                        every update</div>
                                </div>
                                <div
                                    style="width: 50px; height: 24px; background: var(--success); border-radius: 12px; position: relative;">
                                    <div
                                        style="width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; right: 2px; top: 2px;">
                                    </div>
                                </div>
                            </div>
                            <div
                                style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                                <div>
                                    <div style="font-weight: 600;">Predictive Analysis</div>
                                    <div style="font-size: 0.85rem; color: var(--text-muted);">Enable dynamic visiting
                                        time calculation</div>
                                </div>
                                <div
                                    style="width: 50px; height: 24px; background: var(--success); border-radius: 12px; position: relative;">
                                    <div
                                        style="width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; right: 2px; top: 2px;">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" style="width: 100%; justify-content: center;">
                        <i data-lucide="save" size="20"></i> SAVE SETTINGS
                    </button>
                </form>
            </section>

            <div style="margin-top: 2rem; text-align: center;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
                    <i data-lucide="arrow-left" size="14" style="vertical-align: middle;"></i> Return to Dashboard
                </a>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
